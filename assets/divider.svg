<svg xmlns="http://www.w3.org/2000/svg" width="600" height="30" viewBox="0 0 600 30">
  <defs>
    <style>
      .wand-line { stroke: #a0782c; stroke-width: 1; opacity: 0.5; }
      .wand-dot { fill: #d4a855; }
      .spark {
        fill: #d4a855;
        opacity: 0;
        animation: sparkle 3s ease-in-out infinite;
      }
      .sp1 { animation-delay: 0s; }
      .sp2 { animation-delay: 1s; }
      .sp3 { animation-delay: 2s; }
      @keyframes sparkle {
        0%, 100% { opacity: 0; r: 1; }
        50% { opacity: 0.8; r: 2; }
      }
    </style>
  </defs>
  <line class="wand-line" x1="100" y1="15" x2="280" y2="15"/>
  <circle class="wand-dot" cx="290" cy="15" r="2.5"/>
  <circle class="wand-dot" cx="300" cy="15" r="4"/>
  <circle class="wand-dot" cx="310" cy="15" r="2.5"/>
  <line class="wand-line" x1="320" y1="15" x2="500" y2="15"/>

  <circle class="spark sp1" cx="200" cy="12" r="1.5"/>
  <circle class="spark sp2" cx="400" cy="12" r="1.5"/>
  <circle class="spark sp3" cx="300" cy="8" r="1.5"/>
</svg>
